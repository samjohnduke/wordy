<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a44"/>
      <stop offset="1" stop-color="#1e1d24"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#e5dccb"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <!-- page -->
  <rect x="124" y="92" width="264" height="328" rx="18" fill="url(#paper)"/>
  <!-- ruled lines -->
  <g stroke="#b9ad97" stroke-width="10" stroke-linecap="round">
    <line x1="164" y1="156" x2="348" y2="156"/>
    <line x1="164" y1="200" x2="348" y2="200"/>
    <line x1="164" y1="356" x2="300" y2="356"/>
  </g>
  <!-- W drawn as a stroke so no font is needed -->
  <polyline points="160,232 198,330 236,248 274,330 312,232"
            fill="none" stroke="#9b2f2f" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
