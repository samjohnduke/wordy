[package]
name = "wordy-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
wordy-doc = { path = "../wordy-doc" }
docx-rs = "0.4"
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
tiny-skia = "0.11"
cosmic-text = "0.14"
zip = { version = "6", default-features = false, features = ["deflate", "time"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
