name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); ubuntu-latest and windows-latest are x86_64.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies for gpui (Wayland, X11, fonts, audio, Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev libzstd-dev libsqlite3-dev libvulkan-dev libgl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # Nobody on the project has a Windows machine, so this is the only place the
      # Windows build is ever run: start it on a fresh folder, give it a while, and
      # expect it to be alive and to have written the project file.
      - name: Launch check
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: wordy=debug
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'launch-check'
          $err = Join-Path $env:RUNNER_TEMP 'wordy.err'
          $out = Join-Path $env:RUNNER_TEMP 'wordy.out'
          $p = Start-Process -FilePath target\debug\wordy.exe -ArgumentList "`"$dir`"" `
            -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          $saved = Test-Path (Join-Path $dir 'project.loro')
          if ($alive) { Stop-Process -Id $p.Id -Force; Wait-Process -Id $p.Id -ErrorAction SilentlyContinue }
          Write-Host "alive after 25s: $alive; project.loro written: $saved"
          Write-Host '--- stderr ---'; Get-Content $err -ErrorAction SilentlyContinue
          Write-Host '--- stdout ---'; Get-Content $out -ErrorAction SilentlyContinue
          if (-not $alive) { Write-Host "exit code $($p.ExitCode)" }
          if (-not ($alive -and $saved)) { exit 1 }
