[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui-kit = "0.7.0"
loro = "1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
unicode-segmentation = "1.13"
aho-corasick = "1.1"
rusqlite = { version = "0.40", features = ["bundled"] }
spellbook = "0.4"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
